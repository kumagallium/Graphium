[package]
name = "graphium"
version = "0.1.0"
description = "Block-based note editor with PROV-DM provenance tracking"
authors = ["kumagallium"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "graphium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
humantime = "2"
base64 = "0.22"
# 素材サムネイル（read_media_thumbnail）。原寸を WebView に渡さず Rust 側で縮小する
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
trash = "5"
# 会議録音（meeting_audio.rs）。16 kHz mono i16 の WAV を逐次書く
hound = "3"
uuid = { version = "1", features = ["v4"] }
# 文字起こしモデルの取得（meeting_transcribe.rs）。updater 経由で Cargo.lock に既にある reqwest 0.13 と
# 同じ TLS 構成に揃える: reqwest 0.13 の `rustls` feature は aws-lc-rs を引くので `rustls-no-provider` にし、
# provider は updater と同じく rustls（ring）を自前の依存として明示する（updater の feature に依存しない）
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
sha2 = "0.10"
rubato = "5.0.1"
# 端末内の埋め込み（embedding_models.rs）。ONNX Runtime + tokenizers。モデルは同梱せず
# whisper と同じく初回に取得する（hf-hub は使わないので feature から外す）。ONNX Runtime の
# バイナリはビルド時に ort が取得する（download-binaries）。TLS は reqwest と同じ rustls に揃える
# 版は固定する。fastembed 5.14 以降（ort rc.12 以降 = ONNX Runtime 1.24 以降）は Apple Silicon で
# 1 回の推論の中で中間テンソルを解放せず、bge-m3 に 32 文（各 512 トークン）を渡すと本体プロセスが
# 40 秒で 39 GB（ORT 1.31.0）に膨らんで PC 全体がスワップした（microsoft/onnxruntime#29538 の系）。
# 5.13.0（ort rc.11 = ONNX Runtime 1.23.2）は同じ負荷が 6.5 秒・ピーク 1.4 GB で完走する。
# 上げるときは Crucible experiments/2026-11-05-embedding-memory-regression/ の手順で同じ計測をしてから
fastembed = { version = "=5.13.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }

# ウィンドウのサイズ・位置の記憶はデスクトップ専用プラグイン。
# モバイルターゲットではビルド対象から外す（lib.rs 側も #[cfg(desktop)] で囲む）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

# Unix: read_scanned_file がシンボリックリンクを辿らずに開く（O_NOFOLLOW）ために使う。
# 既に他の依存の transitive dep として Cargo.lock には入っているので、バージョンは
# それに解決される。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS: 取り込み等の長い処理の間、隠れたウィンドウでも WKWebView を止めさせない
# （set_background_work_active）。wry が既に使っている版に揃え、依存を増やさない。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSProcessInfo", "NSString"] }

# Windows: sidecar (node.exe) を Job Object で本体プロセスに連動終了させる。
# 親を kill しても子が残る Windows の仕様への対策（詳細は lib.rs の sidecar_job）。
[target.'cfg(windows)'.dependencies]
# features: JobObjects が本体、Threading は JOBOBJECT_EXTENDED_LIMIT_INFORMATION の
# IO_COUNTERS、Security は CreateJobObjectW の SECURITY_ATTRIBUTES 引数が要求する。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

# 会議録音: macOS/Windows のみ。再生音は pinray（macOS=ScreenCaptureKit, Windows=WGC 経由の音声）、
# マイクは cpal。他 OS は meeting_audio.rs のスタブが "unsupported platform" を返す。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.18"
pinray = "=0.2.7"

[dev-dependencies]
tempfile = "3"

# 会議の文字起こし（whisper.cpp の Rust バインディング）。macOS は Metal、Windows は CPU
[target.'cfg(target_os = "macos")'.dependencies.whisper-rs]
version = "0.16"
features = ["metal"]

[target.'cfg(target_os = "windows")'.dependencies.whisper-rs]
version = "0.16"
