[package]
name = "graphium"
version = "0.1.0"
description = "Block-based note editor with PROV-DM provenance tracking"
authors = ["kumagallium"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "graphium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
humantime = "2"
base64 = "0.22"
trash = "5"

# ウィンドウのサイズ・位置の記憶はデスクトップ専用プラグイン。
# モバイルターゲットではビルド対象から外す（lib.rs 側も #[cfg(desktop)] で囲む）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"
