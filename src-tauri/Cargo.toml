[package]
name = "graphium"
version = "0.1.0"
description = "Block-based note editor with PROV-DM provenance tracking"
authors = ["kumagallium"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "graphium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
humantime = "2"
base64 = "0.22"
trash = "5"

# ウィンドウのサイズ・位置の記憶はデスクトップ専用プラグイン。
# モバイルターゲットではビルド対象から外す（lib.rs 側も #[cfg(desktop)] で囲む）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

# Windows: sidecar (node.exe) を Job Object で本体プロセスに連動終了させる。
# 親を kill しても子が残る Windows の仕様への対策（詳細は lib.rs の sidecar_job）。
[target.'cfg(windows)'.dependencies]
# features: JobObjects が本体、Threading は JOBOBJECT_EXTENDED_LIMIT_INFORMATION の
# IO_COUNTERS、Security は CreateJobObjectW の SECURITY_ATTRIBUTES 引数が要求する。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
