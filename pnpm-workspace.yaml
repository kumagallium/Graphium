# pnpm 10+ 用の設定ファイル。
# CI (pnpm/action-setup) は全ワークフローで pnpm 10。以前は test/bench/deploy が 9 で、
# 9 は package.json の "pnpm" フィールドを読むため overrides を両方に置いていた。
# 名残で package.json 側にも同内容がある。片方を変えたら必ず揃えること。
# patchedDependencies（package.json 側）は lockfile に載るハッシュの形式が 9 と 10 で違い、
# 混在させると片方の --frozen-lockfile が必ず落ちる。CI の pnpm を 9 に戻さないこと。

# packages は pnpm 9 が必須としていたフィールド（無いと `ERROR packages field missing or
# empty` で全コマンドが落ちた）。ルート単一パッケージとして宣言する。
packages:
  - "."

# IME ネスト箇条書き複製バグの修正 pin（prosemirror-view 1.41.7 の Safari ガード起因）
overrides:
  prosemirror-view: 1.42.0
  prosemirror-model: 1.25.9

# pnpm 10 は依存パッケージの postinstall を既定でブロックする。
# ここに挙げたものだけ許可（pnpm 9 での全スクリプト実行と同じ結果になる組）。
onlyBuiltDependencies:
  - core-js
  - esbuild
  - msw
