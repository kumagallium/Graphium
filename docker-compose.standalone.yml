# Graphium — standalone editor (no AI features)
#
# Usage:
#   docker compose -f docker-compose.standalone.yml up -d
#   http://localhost:5174/Graphium/
#
# Notes are saved on the server filesystem under /app/data and shared
# across browsers/devices that hit the same URL. To back up via cloud
# sync, mount a Drive/iCloud/Dropbox synced folder onto /app/data.
#
# To enable AI + MCP tools (full Crucible stack), use the default docker-compose.yml:
#   docker compose up -d

services:
  graphium:
    build:
      context: .
    ports:
    # 既定はホストからのみ。ホスト側 IP を省くと Docker は全インターフェースへ
    # 公開するので、同一 LAN の誰でも API に届く。GRAPHIUM_AUTH_TOKEN（合言葉）は
    # 全 API に効く。未設定で LAN に出すと、誰でもノートの読み書きに加えて
    # コンテナ内でコマンドを実行できる（MCP の接続テストなど）。
    # 他端末から使うなら、この 127.0.0.1 を外したうえで、長いランダムな
    # GRAPHIUM_AUTH_TOKEN（例: openssl rand -hex 32）と GRAPHIUM_ALLOWED_HOSTS の
    # 両方を設定すること（後者が未設定だとサーバー側がループバック以外の Host を 403 で落とす）。
      - "127.0.0.1:5174:3001"
    volumes:
      - graphium_data:/app/data
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      - SERVE_STATIC=dist
      # GRAPHIUM_AUTH_TOKEN requires X-Graphium-Token on every /api request (not only storage).
      # Leaving it empty while exposing the port to a LAN lets anyone run commands in the container.
      - GRAPHIUM_AUTH_TOKEN=${GRAPHIUM_AUTH_TOKEN:-}
      # Needed to reach it from another device: Host names the server accepts
      # (e.g. 192.168.1.10:5174) and extra browser origins allowed to write (usually empty).
      - GRAPHIUM_ALLOWED_HOSTS=${GRAPHIUM_ALLOWED_HOSTS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    restart: unless-stopped

volumes:
  graphium_data:
