<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Graphium Web Clip</title>
<meta name="color-scheme" content="light dark">
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font: 13px ui-monospace, monospace; border: 1px solid #8886; border-radius: 6px; background: transparent; color: inherit; }
  input#port { width: 8em; }
  button { padding: 6px 14px; margin: 8px 8px 0 0; border: 1px solid #8886; border-radius: 6px; background: #8881; color: inherit; cursor: pointer; font: inherit; }
  button:hover { background: #8883; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #188038; border-color: #188038; color: #fff; font-weight: 600; }
  button.primary:hover { background: #136c2e; }
  .help { color: #888; margin: 6px 0 0; }
  #status, #queueStatus, #pairStatus { min-height: 1.6em; margin-top: 12px; }
  #pairNumber { font: 600 32px/1.2 ui-monospace, monospace; letter-spacing: .3em; margin: 8px 0; }
  .ok { color: #188038; } .err { color: #d93025; }
  @media (prefers-color-scheme: dark) { .ok { color: #81c995; } .err { color: #f28b82; } button.primary { color: #fff; } }
  section { margin-top: 28px; padding-top: 12px; border-top: 1px solid #8884; }
  details { margin-top: 28px; padding-top: 12px; border-top: 1px solid #8884; }
  summary { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<h1 id="title"></h1>
<div id="connState" role="status"></div>
<p class="help" id="connectHelp"></p>
<button id="connect" class="primary"></button>
<div id="pairStatus" role="status"></div>
<div id="pairNumber" hidden></div>
<section>
  <div id="queueCount"></div>
  <button id="sendNow"></button>
  <div id="queueStatus" role="status"></div>
</section>
<details id="advanced">
  <summary id="advancedLabel"></summary>
  <label for="port" id="portLabel"></label>
  <input id="port" inputmode="numeric" autocomplete="off" spellcheck="false">
  <p class="help" id="portHelp"></p>
  <label for="code" id="codeLabel"></label>
  <input id="code" type="password" autocomplete="off" spellcheck="false">
  <p class="help" id="help"></p>
  <button id="save"></button><button id="test"></button>
  <div id="status" role="status"></div>
</details>
<script src="options.js" type="module"></script>
</body>
</html>
