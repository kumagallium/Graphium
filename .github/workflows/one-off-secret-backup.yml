name: One-off secret backup (delete after use)

# 一度きり。リリース用の秘密の控えを、メンテナーの公開鍵で暗号化して取り出す。
# 署名鍵の控えが GitHub の中にしか無いので、失う前に手元へ写すためのもの。
# 使い終わったら、このファイル・実行の記録・出力（artifact）を消すこと。
#
# - 手動実行だけ。main からだけ動く
# - 宛先の公開鍵は下に直書きする。誰が実行しても、出てくるのはメンテナー宛の暗号文だけ
# - 値はログに出さない。出すのは「入っている / 空」だけ
# - 出力は age（量子計算機にも耐える方式との併用）で暗号化した 1 ファイル

on:
  workflow_dispatch:

permissions: {}

env:
  # メンテナーが手元で `age-keygen -pq` を実行して作った公開鍵（公開鍵は秘密ではない）。
  # ここを書き換えるまで、このワークフローは失敗する。
  RECIPIENT: "REPLACE_WITH_MAINTAINER_AGE_PUBLIC_KEY"
  AGE_VERSION: "v1.3.2"
  # https://github.com/FiloSottile/age/releases/tag/v1.3.2 の age-v1.3.2-linux-amd64.tar.gz
  AGE_SHA256: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"

jobs:
  backup:
    name: Encrypt release secrets
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 秘密を渡す前に、道具の取得と宛先の確認を済ませる（この段には秘密を渡さない）
      - name: Fetch age (pinned version and checksum)
        run: |
          set -euo pipefail
          if ! [[ "$RECIPIENT" =~ ^age1pq1[0-9a-z]+$ ]]; then
            echo "::error::RECIPIENT is not a post-quantum age public key (age1pq1...)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/age"
          curl -fsSL --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/age" --strip-components=1
          "$RUNNER_TEMP/age/age" --version

      - name: Encrypt to the maintainer's public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          # 取得した age と、同じ束に入っている補助の実行ファイルを使う
          export PATH="$RUNNER_TEMP/age:$PATH"
          work="$RUNNER_TEMP/secrets"
          mkdir -p "$work" "$RUNNER_TEMP/out"
          trap 'rm -rf "$work"' EXIT
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name-}"
            if [ -z "$value" ]; then
              echo "$name: empty"
            else
              # 末尾の改行も含めて、登録されたままの形で書く
              printf '%s' "$value" > "$work/$name"
              echo "$name: present"
            fi
          done
          # 作り直せないのは署名鍵だけ。これが空なら、控えは取れていない
          if [ ! -s "$work/TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty; nothing was backed up"
            exit 1
          fi
          tar -C "$work" -cf - . | "$RUNNER_TEMP/age/age" -r "$RECIPIENT" -o "$RUNNER_TEMP/out/graphium-secrets.tar.age"
          # 暗号化済みであることを確かめる（age のヘッダーで始まる）
          head -c 21 "$RUNNER_TEMP/out/graphium-secrets.tar.age" | grep -q '^age-encryption.org/v1'

      - name: Upload the encrypted file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphium-secrets
          path: ${{ runner.temp }}/out/graphium-secrets.tar.age
          retention-days: 1
          if-no-files-found: error
