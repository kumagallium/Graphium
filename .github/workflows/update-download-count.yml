name: Update download badges

on:
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Compute weekly updaters
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 「直近 7 日に出た版のうち、自動更新資産（mac: app.tar.gz / Win: nsis.zip）の
          # ダウンロード数が最も多い版」の数を出す。各版は最新だった間に起動した人が
          # 1 回ずつ取りに来るので、週の最大値 ≒ その週に更新しに来た人数の下限になる。
          #
          # 累計の dmg 数は 2026-10-29 にクローラーが全リリースの dmg を一斉取得して
          # 78 → 472 に膨らみ、指標として壊れた。max 方式なら一斉取得が入っても
          # +1 しか動かない。更新資産は手動インストールと混ざらない点でも dmg より純度が高い。
          #
          # 7 日以内のリリースが無い週は最新 1 件にフォールバックして 0 を避ける。
          # --paginate + --jq はページごとに出力されるので行で流して awk で畳む
          # （ページ境界で合計が複数行になる罠は v0.50.0 時点で踏んだ）。
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.draft | not) | select(.prerelease | not)
                  | "\(.published_at) " + ([.assets[]
                      | select((.name | endswith(".app.tar.gz")) or (.name | endswith(".nsis.zip")))
                      | .download_count] | add // 0 | tostring)' \
            | sort -r > releases.txt
          weekly=$(awk -v since="$since" '$1 >= since { if ($2 > m) m = $2 } END { print m+0 }' releases.txt)
          in_window=$(awk -v since="$since" '$1 >= since' releases.txt | wc -l)
          if [ "$in_window" -eq 0 ]; then
            weekly=$(head -1 releases.txt | awk '{ print $2+0 }')
          fi
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"
          echo "Weekly updaters: $weekly (releases in window: $in_window)"

      - name: Write badge JSON to badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEKLY: ${{ steps.count.outputs.weekly }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          if git fetch --depth=1 origin badges 2>/dev/null; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p badges
          cat > badges/weekly-updaters.json <<EOF
          {
            "schemaVersion": 1,
            "label": "weekly updaters",
            "message": "${WEEKLY}",
            "color": "blue"
          }
          EOF
          # 旧バッジ（累計 dmg）はクローラーで壊れたので廃止
          git rm -q --ignore-unmatch badges/dmg-downloads.json

          git add badges/weekly-updaters.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update weekly updaters to ${WEEKLY}"
          git push origin badges
