name: Release Update Drift Check

# 「最新リリースのタグ」と「GitHub Pages が配信している latest.json の version」が
# 乖離していないか定期監視する。
#
# 背景: macOS ビルドの公証 403 等でビルドが失敗すると、リリース自体は publish される
# のに latest.json が再生成されず、デスクトップアプリの自動更新が古いバージョンに
# 固定される（v0.16.4 / v0.16.5 で実害。latest.json が 0.16.3 のまま固定された）。
# tauri-build の notify-on-failure はビルド失敗を拾うが、こちらは「結果として更新が
# 出ていない」状態を別経路で直接検知する二重の安全網。

on:
  schedule:
    # 毎日 00:00 UTC（リリース直後の一時的な乖離を拾わないよう日次で十分）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare latest release vs published latest.json
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // release-failure ラベル付き Issue を重複なしで起票する共通処理
            const openIssueOnce = async (title, body) => {
              const existing = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: 'release-failure', per_page: 100,
              });
              if (existing.data.some((i) => i.title === title)) {
                core.info(`Issue already open ("${title}"); not duplicating.`);
                return;
              }
              await github.rest.issues.createLabel({
                owner, repo, name: 'release-failure', color: 'b60205',
                description: 'Release/desktop build pipeline failure',
              }).catch(() => {});
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: ['release-failure'],
              });
              core.notice(`Opened issue #${created.data.number}`);
            };

            // 1. 最新の安定版リリース（draft / prerelease を除く）を取得
            const releases = await github.rest.repos.listReleases({
              owner, repo, per_page: 30,
            });
            const stable = releases.data
              .filter((r) => !r.draft && !r.prerelease)
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at))[0];
            if (!stable) {
              core.info('No stable release found; nothing to check.');
              return;
            }
            const releaseVersion = stable.tag_name.replace(/^v/, '');
            const publishedAt = new Date(stable.published_at);

            // リリース直後はビルド進行中で乖離が正常。6 時間以上経過したものだけ対象。
            const ageHours = (Date.now() - publishedAt.getTime()) / 3_600_000;
            if (ageHours < 6) {
              core.info(
                `Latest release ${stable.tag_name} is ${ageHours.toFixed(1)}h old ` +
                `(< 6h); skipping to avoid false positive during in-progress build.`,
              );
              return;
            }

            // 2. GitHub Pages が配信中の latest.json の version を取得
            //
            // 取得失敗（404 / 5xx / ネットワークエラー）は「更新経路そのものが壊れている」
            // 状態なので、version 乖離と同様に Issue 起票の対象にする。
            // 以前は warning のみで握りつぶしていた（fail-open）ため、Pages の
            // legacy 二重デプロイで latest.json が 404 になっても検知できなかった
            // （2026-07-03 の監査で発覚した実害）。一時的なネットワーク断での誤検知を
            // 避けるため 3 回リトライしてから起票する。
            const url = 'https://kumagallium.github.io/Graphium/updater/latest.json';
            let res = null;
            let lastError = '';
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                res = await fetch(url, { cache: 'no-store' });
                if (res.ok) break;
                lastError = `HTTP ${res.status}`;
              } catch (e) {
                res = null;
                lastError = `fetch error: ${e.message}`;
              }
              core.warning(`Attempt ${attempt}/3 failed for ${url}: ${lastError}`);
              if (attempt < 3) await new Promise((r) => setTimeout(r, 30_000));
            }
            if (!res || !res.ok) {
              // タイトルは status を含めず固定にする（日によって 404/503 が揺れても
              // 重複起票しないため。詳細は body に書く）
              await openIssueOnce(
                '🚨 Updater endpoint unreachable: /Graphium/updater/latest.json',
                [
                  '**自動更新エンドポイントの latest.json が取得できません。**',
                  '',
                  `- URL: ${url}`,
                  `- 直近のエラー: \`${lastError}\`（3 回リトライ後）`,
                  '',
                  'デスクトップアプリはこの latest.json（第1エンドポイント）を見て更新有無を',
                  '判定します。GitHub Releases 側の第2エンドポイントがあるため即座に更新停止には',
                  'なりませんが、片肺運転の状態です。',
                  '',
                  '## 典型的な原因',
                  '- GitHub Pages の Source 設定が「GitHub Actions」以外になっている',
                  '  （legacy ブランチ直配信だと生ソースが配られ latest.json は 404 になる。',
                  '  Settings → Pages → Source = GitHub Actions を確認）',
                  '- deploy.yml（Deploy to GitHub Pages）が失敗している',
                  '- 復旧後: `gh workflow run "Deploy to GitHub Pages"` で再デプロイ',
                  '',
                  '_この Issue は release-update-drift-check.yml が自動起票しました。_',
                ].join('\n'),
              );
              return;
            }
            const updater = await res.json();
            const updaterVersion = String(updater.version || '0.0.0');

            // 3. semver 比較（updaterVersion < releaseVersion なら乖離）
            const cmp = (a, b) => {
              const pa = a.split('.').map(Number);
              const pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
              }
              return 0;
            };

            if (cmp(updaterVersion, releaseVersion) >= 0) {
              core.info(
                `OK: updater latest.json = ${updaterVersion}, ` +
                `latest release = ${releaseVersion}. No drift.`,
              );
              return;
            }

            // 4. 乖離検出 → Issue 起票（重複は避ける）
            const title = `🚨 Updater drift: latest.json (${updaterVersion}) < release (${releaseVersion})`;
            const body = [
              `**自動更新の latest.json が最新リリースに追いついていません。**`,
              '',
              `- 最新の安定版リリース: \`${stable.tag_name}\`（${stable.html_url}）`,
              `- GitHub Pages の latest.json: \`${updaterVersion}\``,
              `  ${url}`,
              '',
              'デスクトップアプリ（macOS）はこの latest.json を見て更新有無を判定するため、',
              'この状態が続くとユーザーに更新が出ません。',
              '',
              '## 典型的な原因',
              `- \`${stable.tag_name}\` の macOS ビルドが失敗し \`Graphium_aarch64.app.tar.gz\` が無い`,
              '  （多くは Apple 公証 403 = 規約失効。https://developer.apple.com/account で同意）',
              `- 復旧後: \`gh workflow run "Tauri Desktop Build" -f release_tag=${stable.tag_name}\` で再ビルド`,
              '',
              '_この Issue は release-update-drift-check.yml が自動起票しました。_',
            ].join('\n');

            await openIssueOnce(title, body);
