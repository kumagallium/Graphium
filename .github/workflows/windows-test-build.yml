name: Windows Test Build

# 手動トリガー専用。配布前の動作確認用に Windows .exe を生成して
# Artifacts に上げるだけ（GitHub Release への upload はしない）。
# 通常のリリース経路は tauri-build.yml の release イベントトリガーに任せる。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to build (default: current branch)"
        required: false
        default: ""
  # Verify Windows build still works on PRs that touch desktop-build paths.
  #
  # tauri.conf.json と package.json を外しているのは、tagpr のリリース PR が
  # その 2 つ（＋ CHANGELOG.md）しか触らないため。tagpr は GITHUB_TOKEN で push する
  # ので、リリース PR の run は GitHub の承認ゲートに掛かって一度も実行されず、
  # マージ時に failure として残る。「走っていない赤」を毎リリース出さないために、
  # run の生成段階で外す（承認ゲートはジョブ評価より前なので if: では止められない）。
  #
  # 外したことで、tauri.conf.json だけ / package.json だけを変える PR ではこの
  # 事前確認が走らなくなる。許容している理由は 2 つ:
  #   - 依存の変更は必ず pnpm-lock.yaml を伴うので、そちらで拾える
  #   - これは配布前の動作確認であって、実際のリリースビルドは tauri-build.yml が
  #     release イベントで必ず回す。取りこぼしても本番の成果物は検証される
  # 必要なときは workflow_dispatch で ref を指定して手動で回せる。
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "!src-tauri/tauri.conf.json"
      - "scripts/fetch-node.mjs"
      - "scripts/fetch-fonts.mjs"
      - "scripts/bundle-server.mjs"
      - "src/lib/sidecar.ts"
      - ".github/workflows/windows-test-build.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tauri 2.12.4 と同じ WiX・SHA256 を使い、一時的な配布元エラーは再試行する。
      # https://github.com/tauri-apps/tauri/blob/tauri-v2.12.4/crates/tauri-bundler/src/bundle/windows/msi/mod.rs
      # 過去タグを checkout して再ビルドできるよう、取得処理はワークフロー内に置く。
      - name: Cache WiX archive
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/graphium-wix314-binaries.zip
          key: Windows-WiX3141rtm-6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31

      - name: Prepare WiX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePath = Join-Path $env:RUNNER_TEMP 'graphium-wix314-binaries.zip'
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $expectedHash = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          if (-not (Test-Path -LiteralPath $archivePath)) {
            curl.exe --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output $archivePath $url
            if ($LASTEXITCODE -ne 0) {
              throw "WiX archive download failed (exit code $LASTEXITCODE)"
            }
          }
          # キャッシュ復元時も毎回検証し、一致するアーカイブだけを展開する。
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "WiX archive SHA256 mismatch: expected $expectedHash, got $actualHash"
          }
          $toolsPath = Join-Path $env:LOCALAPPDATA 'tauri/WixTools314'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $toolsPath -Force

      # Tauri 2.12.4 用の公式 NSIS とプラグインを API 経由で事前取得する。
      # 過去タグの再ビルドでも利用できるよう、この処理はワークフロー内に置く。
      - name: Cache NSIS assets
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/graphium-nsis-assets
          key: Windows-NSIS-3.13-ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8-utils-0.5.3-5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709

      - name: Prepare NSIS tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $assetsPath = Join-Path $env:RUNNER_TEMP 'graphium-nsis-assets'
          New-Item -ItemType Directory -Path $assetsPath -Force | Out-Null
          $assets = @(
            @{
              Repo = 'tauri-apps/binary-releases'
              Tag = 'nsis-3.13'
              File = 'nsis-3.13.zip'
              Hash = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
            },
            @{
              Repo = 'tauri-apps/nsis-tauri-utils'
              Tag = 'nsis_tauri_utils-v0.5.3'
              File = 'nsis_tauri_utils.dll'
              Hash = '5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709'
            }
          )
          foreach ($asset in $assets) {
            $assetPath = Join-Path $assetsPath $asset.File
            if (-not (Test-Path -LiteralPath $assetPath)) {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                gh release download $asset.Tag --repo $asset.Repo --pattern $asset.File --dir $assetsPath --clobber
                if ($LASTEXITCODE -eq 0) { break }
                if ($attempt -eq 3) {
                  throw "$($asset.File) download failed after 3 attempts"
                }
                Start-Sleep -Seconds 5
              }
            }
            # キャッシュ復元時も両ファイルを検証し、全て一致するまで展開しない。
            $actualHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $asset.Hash) {
              throw "$($asset.File) SHA256 mismatch: expected $($asset.Hash), got $actualHash"
            }
          }

          $toolsPath = Join-Path $env:LOCALAPPDATA 'tauri/NSIS'
          $extractPath = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          try {
            Expand-Archive -LiteralPath (Join-Path $assetsPath 'nsis-3.13.zip') -DestinationPath $extractPath
            New-Item -ItemType Directory -Path $toolsPath -Force | Out-Null
            # ZIP の外側のディレクトリを外し、既存 NSIS の直下へ内容を配置する。
            Get-ChildItem -LiteralPath (Join-Path $extractPath 'nsis-3.13') -Force |
              Copy-Item -Destination $toolsPath -Recurse -Force
            $pluginPath = Join-Path $toolsPath 'Plugins/x86-unicode/additional'
            New-Item -ItemType Directory -Path $pluginPath -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $assetsPath 'nsis_tauri_utils.dll') -Destination $pluginPath -Force
          } finally {
            if (Test-Path -LiteralPath $extractPath) {
              Remove-Item -LiteralPath $extractPath -Recurse -Force
            }
          }

      - name: Install dependencies
        run: pnpm install

      - name: Bundle Node.js runtime for sidecar
        run: node scripts/fetch-node.mjs

      - name: Bundle server
        run: node scripts/bundle-server.mjs

      # pnpm build が scripts/fetch-fonts.mjs 経由で日本語 Web フォント（約 8MB）を取得する。
      # キー / restore-keys の方針は test.yml の同ステップのコメント参照。
      - name: Cache Japanese webfonts
        uses: actions/cache@v4
        with:
          path: public/fonts/jp
          key: jp-fonts-${{ runner.os }}-${{ hashFiles('scripts/fetch-fonts.mjs') }}

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app (Windows)
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi -Destination artifacts/ -ErrorAction SilentlyContinue
          Copy-Item -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe -Destination artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphium-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
