name: Windows Test Build

# 手動トリガー専用。配布前の動作確認用に Windows .exe を生成して
# Artifacts に上げるだけ（GitHub Release への upload はしない）。
# 通常のリリース経路は tauri-build.yml の release イベントトリガーに任せる。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to build (default: current branch)"
        required: false
        default: ""
  # Verify Windows build still works on PRs that touch desktop-build paths.
  #
  # tauri.conf.json と package.json を外しているのは、tagpr のリリース PR が
  # その 2 つ（＋ CHANGELOG.md）しか触らないため。tagpr は GITHUB_TOKEN で push する
  # ので、リリース PR の run は GitHub の承認ゲートに掛かって一度も実行されず、
  # マージ時に failure として残る。「走っていない赤」を毎リリース出さないために、
  # run の生成段階で外す（承認ゲートはジョブ評価より前なので if: では止められない）。
  #
  # 外したことで、tauri.conf.json だけ / package.json だけを変える PR ではこの
  # 事前確認が走らなくなる。許容している理由は 2 つ:
  #   - 依存の変更は必ず pnpm-lock.yaml を伴うので、そちらで拾える
  #   - これは配布前の動作確認であって、実際のリリースビルドは tauri-build.yml が
  #     release イベントで必ず回す。取りこぼしても本番の成果物は検証される
  # 必要なときは workflow_dispatch で ref を指定して手動で回せる。
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "!src-tauri/tauri.conf.json"
      - "scripts/fetch-node.mjs"
      - "scripts/node-hashes.mjs"
      - "scripts/fetch-fonts.mjs"
      - "scripts/bundle-server.mjs"
      - "src/lib/sidecar.ts"
      - ".github/workflows/windows-test-build.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tauri 2.12.4 と同じ WiX・SHA256 を使い、一時的な配布元エラーは再試行する。
      # https://github.com/tauri-apps/tauri/blob/tauri-v2.12.4/crates/tauri-bundler/src/bundle/windows/msi/mod.rs
      # 過去タグを checkout して再ビルドできるよう、取得処理はワークフロー内に置く。
      - name: Cache WiX archive
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/graphium-wix314-binaries.zip
          key: Windows-WiX3141rtm-6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31

      - name: Prepare WiX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePath = Join-Path $env:RUNNER_TEMP 'graphium-wix314-binaries.zip'
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $expectedHash = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          if (-not (Test-Path -LiteralPath $archivePath)) {
            curl.exe --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output $archivePath $url
            if ($LASTEXITCODE -ne 0) {
              throw "WiX archive download failed (exit code $LASTEXITCODE)"
            }
          }
          # キャッシュ復元時も毎回検証し、一致するアーカイブだけを展開する。
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "WiX archive SHA256 mismatch: expected $expectedHash, got $actualHash"
          }
          $toolsPath = Join-Path $env:LOCALAPPDATA 'tauri/WixTools314'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $toolsPath -Force

      # Tauri 2.12.4 用の公式 NSIS とプラグインを API 経由で事前取得する。
      # 過去タグの再ビルドでも利用できるよう、この処理はワークフロー内に置く。
      - name: Cache NSIS assets
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/graphium-nsis-assets
          key: Windows-NSIS-3.13-ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8-utils-0.5.3-5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709

      - name: Prepare NSIS tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $assetsPath = Join-Path $env:RUNNER_TEMP 'graphium-nsis-assets'
          New-Item -ItemType Directory -Path $assetsPath -Force | Out-Null
          $assets = @(
            @{
              Repo = 'tauri-apps/binary-releases'
              Tag = 'nsis-3.13'
              File = 'nsis-3.13.zip'
              Hash = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
            },
            @{
              Repo = 'tauri-apps/nsis-tauri-utils'
              Tag = 'nsis_tauri_utils-v0.5.3'
              File = 'nsis_tauri_utils.dll'
              Hash = '5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709'
            }
          )
          foreach ($asset in $assets) {
            $assetPath = Join-Path $assetsPath $asset.File
            if (-not (Test-Path -LiteralPath $assetPath)) {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                gh release download $asset.Tag --repo $asset.Repo --pattern $asset.File --dir $assetsPath --clobber
                if ($LASTEXITCODE -eq 0) { break }
                if ($attempt -eq 3) {
                  throw "$($asset.File) download failed after 3 attempts"
                }
                Start-Sleep -Seconds 5
              }
            }
            # キャッシュ復元時も両ファイルを検証し、全て一致するまで展開しない。
            $actualHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $asset.Hash) {
              throw "$($asset.File) SHA256 mismatch: expected $($asset.Hash), got $actualHash"
            }
          }

          $toolsPath = Join-Path $env:LOCALAPPDATA 'tauri/NSIS'
          $extractPath = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          try {
            Expand-Archive -LiteralPath (Join-Path $assetsPath 'nsis-3.13.zip') -DestinationPath $extractPath
            New-Item -ItemType Directory -Path $toolsPath -Force | Out-Null
            # ZIP の外側のディレクトリを外し、既存 NSIS の直下へ内容を配置する。
            Get-ChildItem -LiteralPath (Join-Path $extractPath 'nsis-3.13') -Force |
              Copy-Item -Destination $toolsPath -Recurse -Force
            $pluginPath = Join-Path $toolsPath 'Plugins/x86-unicode/additional'
            New-Item -ItemType Directory -Path $pluginPath -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $assetsPath 'nsis_tauri_utils.dll') -Destination $pluginPath -Force
          } finally {
            if (Test-Path -LiteralPath $extractPath) {
              Remove-Item -LiteralPath $extractPath -Recurse -Force
            }
          }

      - name: Install dependencies
        run: pnpm install

      - name: Bundle Node.js runtime for sidecar
        run: node scripts/fetch-node.mjs

      - name: Bundle server
        run: node scripts/bundle-server.mjs

      # 同梱の node.exe で sidecar を実起動し、/api/health が応答するか確かめる。
      # アプリ（start_native_sidecar）と同じく絶対パス・同じ環境変数で起動する。
      # v0.134.0〜v0.171 では Windows で `\\?\C:\...` 形式のパスを node に渡していて、
      # Node.js v22.23.5 がエントリを解決できず起動直後に exit 1 で落ちていた（どの CI も
      # node.exe を実起動していなかったので気付けなかった）。参考として `\\?\` 形式の結果も出す。
      - name: Smoke test bundled sidecar with bundled node.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Resolve-Path 'src-tauri/sidecar/node.exe').Path
          $server = (Resolve-Path 'src-tauri/sidecar/server.mjs').Path
          & $node --version

          # 参考: `\\?\` 形式（修正前にアプリが渡していた形）。結果は判定に使わない
          $verbatimLog = Join-Path $env:RUNNER_TEMP 'sidecar-verbatim.log'
          $p0 = Start-Process -FilePath $node -ArgumentList "`"\\?\$server`"" -PassThru -NoNewWindow -RedirectStandardError $verbatimLog -RedirectStandardOutput "$verbatimLog.out"
          if (-not $p0.WaitForExit(10000)) { $p0.Kill() }
          Write-Host "verbatim path: exit=$($p0.ExitCode)"
          Get-Content $verbatimLog -ErrorAction SilentlyContinue | Select-Object -First 5

          # 本番: 修正後の形（`\\?\` を外した絶対パス）
          $dataDir = Join-Path $env:RUNNER_TEMP 'sidecar-data'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $env:PORT = '13001'
          $env:DATA_DIR = $dataDir
          $env:GRAPHIUM_DESKTOP = '1'
          $env:GRAPHIUM_AUTH_TOKEN = ('0' * 64)
          $env:GRAPHIUM_USE_KEYCHAIN = '0'
          $env:GRAPHIUM_PARENT_PID = "$PID"
          $env:CORS_ORIGINS = 'tauri://localhost,http://tauri.localhost,https://tauri.localhost'
          $log = Join-Path $env:RUNNER_TEMP 'sidecar.log'
          $p = Start-Process -FilePath $node -ArgumentList "`"$server`"" -PassThru -NoNewWindow -RedirectStandardError $log -RedirectStandardOutput "$log.out"
          try {
            for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) {
                Write-Host "ERROR: sidecar exited with code $($p.ExitCode)"
                Get-Content $log, "$log.out" -ErrorAction SilentlyContinue
                exit 1
              }
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:13001/api/health' -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) {
                  Write-Host "Sidecar healthy after ${i}s"
                  exit 0
                }
              } catch { }
            }
            Write-Host 'ERROR: sidecar did not respond on /api/health within 30s'
            Get-Content $log, "$log.out" -ErrorAction SilentlyContinue
            exit 1
          } finally {
            if (-not $p.HasExited) { $p.Kill() }
          }

      # pnpm build が scripts/fetch-fonts.mjs 経由で日本語 Web フォント（約 8MB）を取得する。
      # キー / restore-keys の方針は test.yml の同ステップのコメント参照。
      - name: Cache Japanese webfonts
        uses: actions/cache@v4
        with:
          path: public/fonts/jp
          key: jp-fonts-${{ runner.os }}-${{ hashFiles('scripts/fetch-fonts.mjs') }}

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app (Windows)
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc

      # 自動更新の経路を実地で通す: 入れる → 起動 → 起動中のまま、updater と同じ引数
      # （/P /UPDATE /R）でインストーラを走らせる。v0.172 で、自動更新のたびに
      # "Failed to kill Graphium" で止まる利用者がいた。どの CI もインストーラを
      # 起動中のアプリに対して走らせていなかったので、ここで確かめる。
      - name: Smoke test in-app update over a running Graphium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1).FullName
          $installDir = Join-Path $env:LOCALAPPDATA 'Graphium'
          $exe = Join-Path $installDir 'Graphium.exe'

          # 1. 初回インストール（何も動いていない状態）
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          Write-Host "first install: exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $exe)) { throw 'first install failed' }

          # 2. 起動して sidecar まで立ち上がるのを待つ
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Graphium exited early: exit=$($app.ExitCode)" }
          Get-Process -Name Graphium, node -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path -AutoSize

          # 3. 診断の表示を確かめる。-TimeoutSec 0 なら止めずにすぐ一覧を出す。
          #    起動中なので「開いているプロセス」に Graphium の PID が出るはず
          $diag = & powershell -NoProfile -ExecutionPolicy Bypass -File 'src-tauri/windows/wait-app-exit.ps1' -InstallDir $installDir -TimeoutSec 0
          $diag | ForEach-Object { Write-Host $_ }
          if (-not ($diag -match "PID $($app.Id)")) { throw 'wait-app-exit.ps1 did not list the running Graphium' }
          if ($app.HasExited) { throw 'wait-app-exit.ps1 with -TimeoutSec 0 must not stop the app' }

          # 4. 自動更新と同じ引数で、起動中のアプリの上からインストールする
          $u = Start-Process -FilePath $setup -ArgumentList '/P', '/UPDATE', '/R' -PassThru
          if (-not $u.WaitForExit(180000)) {
            $u.Kill()
            throw 'update install did not finish within 180s (stuck on an error page?)'
          }
          Write-Host "update install: exit=$($u.ExitCode)"
          if ($u.ExitCode -ne 0) { throw "update install failed: exit=$($u.ExitCode)" }

          # 5. 他のソフトが Graphium.exe を掴んだままの状態を作る（v0.172.2 で McAfee
          #    Framework Host が掴んで毎回止まった利用者の再現）。アプリは止め、別の
          #    PowerShell に Graphium.exe を開かせたままにする
          Start-Sleep -Seconds 5
          Get-Process -Name Graphium -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $holderCmd = "`$f = [IO.File]::Open('$exe', 'Open', 'Read', 'ReadWrite, Delete'); Start-Sleep -Seconds 600"
          $holder = Start-Process -FilePath powershell -ArgumentList '-NoProfile', '-Command', $holderCmd -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $diag2 = & powershell -NoProfile -ExecutionPolicy Bypass -File 'src-tauri/windows/wait-app-exit.ps1' -InstallDir $installDir -TimeoutSec 5
          $diagExit = $LASTEXITCODE
          $diag2 | ForEach-Object { Write-Host $_ }
          Write-Host "wait-app-exit.ps1 with another holder: exit=$diagExit"
          if ($diagExit -ne 2) { throw 'expected exit 2 (only other programs hold Graphium.exe)' }

          # 6. その状態で、自動更新と同じ引数でインストールする。旧 Graphium.exe を退避して
          #    先へ進むので、掴んでいるプロセスはテンプレートに止められず生き残るはず
          $u2 = Start-Process -FilePath $setup -ArgumentList '/P', '/UPDATE' -PassThru
          if (-not $u2.WaitForExit(180000)) {
            $u2.Kill()
            throw 'update install with another holder did not finish within 180s'
          }
          Write-Host "update install with another holder: exit=$($u2.ExitCode)"
          Get-ChildItem -LiteralPath $installDir -Filter 'Graphium.exe*' | Format-Table Name, Length -AutoSize
          if ($u2.ExitCode -ne 0) { throw "update install with another holder failed: exit=$($u2.ExitCode)" }
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Graphium.exe missing after update' }
          if ($holder.HasExited) { throw 'the holder was shut down: the old Graphium.exe was not moved aside' }
          $holder.Kill()

          # 7. 片付け（/R で立ち上がり直したアプリも止める）
          Get-Process -Name Graphium -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir\sidecar\*" } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi -Destination artifacts/ -ErrorAction SilentlyContinue
          Copy-Item -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe -Destination artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphium-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
