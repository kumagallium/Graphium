name: Rust Checks

# デスクトップ版（src-tauri）の clippy とテスト。clippy は警告が 1 件でもあれば落とす
# （-D warnings）。テストには updater の設定（requireSignedVersion）を固定するものなど、
# 配布物の安全に関わるものが含まれる。
#
# macOS と Windows の両方で回すのは、OS ごとに組み込まれるコードが違うため。
# 片方の OS でしか使わない関数は、もう片方では「未使用」になる（#1440 で
# parse_mount_line が Windows でだけ警告になった）。配布していない Linux は回さない。
#
# toolchain は stable なので、Rust の新しい版で lint が増えると、src-tauri を触った
# PR で初めて落ちることがある。そのときはその PR で直す（clippy の help に直し方が出る）。

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-checks.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri の build script は externalBin（sidecar の node）と resources、
      # frontendDist の存在を確かめる。clippy に要るのはその「存在」だけなので、
      # フロントエンドのビルド（pnpm build）はせず空の dist で足りる。
      - name: Prepare sidecar and an empty frontend dist
        shell: bash
        run: |
          node scripts/fetch-node.mjs
          node scripts/bundle-server.mjs
          mkdir -p dist

      # ランナーのイメージ版をキャッシュの鍵に入れる。whisper-rs-sys の build script は
      # cmake を回し、CMakeCache にコンパイラの絶対パス（MSVC 14.51.xxx など）を覚える。
      # イメージ更新で MSVC が上がると、古いイメージで作ったキャッシュを戻したジョブだけ
      # 「CMAKE_ASM_COMPILER ... is not a full path to an existing compiler tool」で落ちる。
      # イメージは段階的に切り替わるので、新旧が混ざる間は通ったり落ちたりする。
      # ImageVersion はランナーのプロセス環境変数で、式の env コンテキストには無いので
      # ステップの出力に移してから使う。
      - name: Read runner image version
        id: image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and target
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: rust-checks-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-checks-${{ runner.os }}-${{ steps.image.outputs.version }}-
            rust-checks-${{ runner.os }}-

      # 別のイメージで作ったキャッシュ（または鍵にイメージ版が無い旧形式）を戻したときは、
      # コンパイラのパスを覚えている whisper-rs-sys の成果物だけ捨てて作り直させる。
      # ほかのクレートの成果物は残すので、ビルド時間の増加は whisper.cpp の分だけ。
      - name: Drop cmake output built on another runner image
        if: >-
          steps.cargo-cache.outputs.cache-matched-key != '' &&
          !startsWith(steps.cargo-cache.outputs.cache-matched-key,
                      format('rust-checks-{0}-{1}-', runner.os, steps.image.outputs.version))
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p whisper-rs-sys

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
