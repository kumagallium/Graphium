name: Roadmap nudge

# リリース PR（tagpr が作る）に、前回リリース以降のマージ済み PR 一覧を貼る。
# 「この中にマニュアルの機能ロードマップへ載せる節目はあるか」を、判断が必要な
# タイミングで一度だけ聞くのが目的。ロードマップの自動生成はしない — 85 リリースから
# 節目だけを選んだ編集判断こそがあのページの価値なので、機械は材料を出すに留める。

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  nudge:
    # tagpr のリリース PR だけが対象
    if: startsWith(github.head_ref, 'tagpr-from-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect merged PRs since the last release
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last_tag=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "")
          echo "last tag: $last_tag"
          if [ -n "$last_tag" ]; then
            range="$last_tag..origin/main"
          else
            range="origin/main"
          fi
          # マージコミットの件名から PR 番号とタイトルを拾う（squash マージ運用）
          git log "$range" --no-merges --pretty=format:'%s' \
            | grep -E '\(#[0-9]+\)$' \
            | sed -E 's/^/- /' > /tmp/prs.txt || true
          count=$(wc -l < /tmp/prs.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Comment on the release PR
        if: steps.collect.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### マニュアルの機能ロードマップ"
            echo
            echo "前回のリリース以降にマージされた変更です。**「できること」が変わったものがあれば**、"
            echo "\`manual/roadmap.md\` と \`manual/ja/roadmap.md\` に 1 行ずつ足してください"
            echo "（該当する章に \`Added in vX.Y.Z\` バッジも）。無ければこのコメントは無視して構いません。"
            echo
            cat /tmp/prs.txt
            echo
            echo "---"
            echo "全変更の記録は CHANGELOG から自動で[リリース履歴](https://kumagallium.github.io/Graphium/manual/release-history)に載るので、ここで拾うのは節目だけです。"
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md --repo "$GITHUB_REPOSITORY"
