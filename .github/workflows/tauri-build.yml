name: Tauri Desktop Build

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build (e.g. v0.3.1)"
        required: true

permissions:
  contents: write
  # actions: write は最終ステップで `gh workflow run "Deploy to GitHub Pages"` を
  # workflow_dispatch で叩くために必要。デフォルトの GITHUB_TOKEN には
  # actions スコープが付かないので明示的に付与しないと 403 で落ちる
  # （v0.11.0 release で実害）。
  actions: write
  # issues: write は notify-on-failure ジョブがビルド失敗時に Issue を起票するために必要。
  # macOS の公証 403（Apple 規約失効）等でビルドが「静かに」失敗し、数日後に
  # 「アプリが更新されない」で初めて気づく事故（v0.16.4 / v0.16.5）を防ぐ。
  issues: write

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve release ID
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.release?.tag_name || '${{ inputs.release_tag }}';
            core.setOutput('tag', tag);
            if (context.payload.release?.id) {
              core.setOutput('release_id', context.payload.release.id);
              return;
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            core.setOutput('release_id', release.id);

  # macOS Apple Silicon + Windows x64.
  # Linux / Intel macOS are still off because there's no developer with
  # those targets to verify release builds end-to-end (see CONTRIBUTING).
  build:
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Bundle Node.js runtime for sidecar
        run: node scripts/fetch-node.mjs

      - name: Bundle server
        run: node scripts/bundle-server.mjs

      # バンドル直後に sidecar を実起動して /api/health が 200 を返すか確認する。
      # ESM bundle で __dirname が定義されない罠 や、新しい依存が package 内資産を
      # 読みに行って起動即死する罠（0.9.2 で jsdom が踏んだやつ）を、production 配布前に
      # 確実に検出する。
      # Windows runner は bash の `&` が信頼性低いので Linux runner で代表テストする。
      - name: Smoke test bundled sidecar
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          PORT=13001
          DATA_DIR=$(mktemp -d)
          PORT=$PORT DATA_DIR=$DATA_DIR node src-tauri/sidecar/server.mjs > /tmp/sidecar-smoke.log 2>&1 &
          SIDECAR_PID=$!
          trap "kill $SIDECAR_PID 2>/dev/null || true" EXIT
          # 起動完了を最大 15 秒待つ
          for i in $(seq 1 15); do
            if curl -fsS "http://localhost:${PORT}/api/health" > /tmp/sidecar-health.json 2>/dev/null; then
              echo "Sidecar healthy after ${i}s"
              cat /tmp/sidecar-health.json
              echo ""
              exit 0
            fi
            if ! kill -0 $SIDECAR_PID 2>/dev/null; then
              echo "ERROR: Sidecar process died during smoke test"
              cat /tmp/sidecar-smoke.log
              exit 1
            fi
            sleep 1
          done
          echo "ERROR: Sidecar did not respond on /api/health within 15s"
          cat /tmp/sidecar-smoke.log
          exit 1

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Apple Developer ID code-signing & notarization (macOS only).
          # tauri-action imports APPLE_CERTIFICATE (base64 .p12) into a temp
          # keychain, signs with APPLE_SIGNING_IDENTITY, and submits the bundle
          # to the notarization service using APPLE_ID + APPLE_PASSWORD
          # (app-specific) under APPLE_TEAM_ID.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

      # tauri-action はインストーラ（.exe / .msi）はリリースに上げるが、Windows の
      # NSIS updater バンドル（-setup.nsis.zip）は上げない（v0.16.7 で実害: latest.json
      # の windows-x86_64 が署名空＋存在しない URL を指し、自動更新が壊れた）。
      # macOS は tauri-action が .app.tar.gz を _aarch64 付きの正しい名前で上げるので
      # 触らない（ここで再アップすると別名のゴミ資産になる）。Windows の .nsis.zip だけ
      # 明示アップロードして generate-updater-json が拾えるようにする。
      # ローカル名 Graphium_<ver>_x64-setup.nsis.zip = 期待アセット名で一致する。
      #
      # 重要な設計上の注意:
      # - パスは $GITHUB_WORKSPACE 起点の絶対パスを find で探す。相対パスだと
      #   tauri-action 実行後の CWD ずれで glob が一致せず空振りする（実害）。
      # - continue-on-error: true。ここで落としてもビルドジョブを失敗させない。
      #   失敗させると generate-updater-json が skip され、macOS の latest.json
      #   再生成まで巻き添えになる。Windows バンドルが取れなくても macOS の更新は
      #   守り、欠落は generate-updater-json 末尾の Verify ステップで可視化する。
      - name: Upload Windows NSIS updater bundle to release
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${{ needs.resolve-release.outputs.tag }}"
          ROOT="${GITHUB_WORKSPACE:-.}"
          echo "Searching for -setup.nsis.zip under ${ROOT}/src-tauri/target ..."
          mapfile -t ZIPS < <(find "${ROOT}/src-tauri/target" -name '*-setup.nsis.zip' 2>/dev/null)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "::warning::No -setup.nsis.zip found. generate-updater-json の Verify が欠落を検知して fail させる。診断のため nsis ディレクトリを列挙:"
            find "${ROOT}/src-tauri/target" -path '*bundle/nsis*' 2>/dev/null || true
            exit 0
          fi
          for f in "${ZIPS[@]}"; do
            echo "Uploading Windows updater bundle: $f"
            gh release upload "$TAG" "$f" --clobber --repo "${{ github.repository }}"
          done

  # 全ビルド完了後、リリースアセットをダウンロードして署名 → latest.json 生成
  generate-updater-json:
    needs: [resolve-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Download updater assets and sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          TAG="${{ needs.resolve-release.outputs.tag }}"
          REPO="${{ github.repository }}"
          VERSION="${TAG#v}"

          mkdir -p /tmp/assets

          # tauri-action upload patterns:
          #   macOS arm64: Graphium_aarch64.app.tar.gz
          #   Windows x64 NSIS updater bundle: Graphium_${VERSION}_x64-setup.nsis.zip
          ASSETS=(
            "Graphium_aarch64.app.tar.gz"
            "Graphium_${VERSION}_x64-setup.nsis.zip"
          )

          for ASSET in "${ASSETS[@]}"; do
            echo "Downloading $ASSET..."
            gh release download "$TAG" --pattern "$ASSET" --dir /tmp/assets --repo "$REPO" --clobber 2>/dev/null || {
              echo "WARNING: $ASSET not found, skipping"
              continue
            }

            echo "Signing $ASSET..."
            tauri signer sign "/tmp/assets/$ASSET" -k "$TAURI_SIGNING_PRIVATE_KEY" -p "" 2>&1 || echo "WARNING: signing failed for $ASSET"
          done

          echo "Signatures generated:"
          ls -la /tmp/assets/*.sig 2>/dev/null || echo "No signatures"

          echo "Signatures generated:"
          ls -la /tmp/assets/*.minisig 2>/dev/null || echo "No signatures"

      - name: Build latest.json
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-release.outputs.tag }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          read_sig() {
            local file="/tmp/assets/$1.sig"
            if [ -f "$file" ]; then
              cat "$file"
            fi
          }

          # 期待するプラットフォーム → updater バンドルのアセット名。
          declare -A ASSET_OF=(
            ["darwin-aarch64"]="Graphium_aarch64.app.tar.gz"
            ["windows-x86_64"]="Graphium_${VERSION}_x64-setup.nsis.zip"
          )

          PLATFORMS_JSON="{}"
          MISSING=""
          for KEY in "${!ASSET_OF[@]}"; do
            ASSET="${ASSET_OF[$KEY]}"
            SIG="$(read_sig "$ASSET")"
            if [ -z "$SIG" ]; then
              # 署名が取れない = updater バンドルが欠落 or 署名失敗。
              # 壊れたエントリ（署名空＋存在しない URL）を絶対に latest.json へ
              # 書かない。該当プラットフォームは除外し、後段の検証で fail させる。
              echo "::warning::No signature for ${KEY} (${ASSET}); excluding it from latest.json"
              MISSING="${MISSING} ${KEY}"
              continue
            fi
            PLATFORMS_JSON="$(jq -n \
              --argjson cur "$PLATFORMS_JSON" \
              --arg k "$KEY" \
              --arg sig "$SIG" \
              --arg url "${BASE_URL}/${ASSET}" \
              '$cur + {($k): {signature: $sig, url: $url}}')"
          done

          jq -n \
            --arg v "$VERSION" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson p "$PLATFORMS_JSON" \
            '{version: $v, notes: "See the changelog for details.", pub_date: $d, platforms: $p}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

          # 欠落プラットフォームを後段の検証ステップへ引き継ぐ。
          echo "MISSING_PLATFORMS=${MISSING# }" >> "$GITHUB_ENV"

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve-release.outputs.tag }}"
          gh release upload "$TAG" latest.json --clobber --repo "${{ github.repository }}"

      # main の public/updater/latest.json を更新して GitHub Pages 経由で
      # 「絶対最新」の latest.json を固定 URL から配信できるようにする。
      # これにより「直近で Latest フラグが立った release」の latest.json ではなく
      # 「現時点で公開されている中で最も新しいバージョン」を必ず指す。
      - name: Publish latest.json to main (for GitHub Pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ needs.resolve-release.outputs.tag }}"
          NEW_VERSION="${TAG#v}"

          # 直前ステップで生成した latest.json を退避してから fresh clone へ移動する
          GENERATED="$(pwd)/latest.json"
          if [ ! -f "$GENERATED" ]; then
            echo "ERROR: latest.json not found at $GENERATED"
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          git clone --depth=1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            "$WORKDIR/repo"
          cd "$WORKDIR/repo"

          # 既存の latest.json と semver 比較。旧バージョン用ワークフローが
          # 遅れて走った場合、現在公開中のものより小さいなら上書きしない。
          CURRENT_FILE="public/updater/latest.json"
          if [ -f "$CURRENT_FILE" ]; then
            CURRENT_VERSION=$(jq -r '.version' "$CURRENT_FILE" 2>/dev/null || echo "0.0.0")
          else
            CURRENT_VERSION="0.0.0"
          fi

          # NEW_VERSION > CURRENT_VERSION を semver 的に判定
          HIGHEST=$(printf "%s\n%s\n" "$CURRENT_VERSION" "$NEW_VERSION" | sort -V | tail -n1)
          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ] || [ "$HIGHEST" != "$NEW_VERSION" ]; then
            echo "Skip: current=$CURRENT_VERSION new=$NEW_VERSION — not a newer release"
            exit 0
          fi

          mkdir -p public/updater
          cp "$GENERATED" "$CURRENT_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CURRENT_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "[chore] Publish latest.json for ${TAG} to Pages"

          # tagpr 等が main を更新している可能性があるため pull --rebase してから push
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Published latest.json for ${TAG}"
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
            if [ "$i" = "3" ]; then
              echo "ERROR: Failed to push after 3 attempts"
              exit 1
            fi
          done

      # GITHUB_TOKEN 由来の commit は他の workflow を `on: push` で triggers
      # しない（再帰防止仕様）ため、Pages 配信用の deploy.yml が走らず Pages の
      # latest.json が古いままになる罠を踏んだ（0.9.2 release で実害）。
      # workflow_dispatch は GITHUB_TOKEN でも triggers されるので、ここで明示的に
      # deploy.yml を叩いて Pages を確実に最新化する。
      - name: Trigger Pages deploy (workflow_dispatch escapes the GITHUB_TOKEN no-recursion rule)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy to GitHub Pages" --ref main --repo "${{ github.repository }}"

      # 再発防止ガードレール: 期待する updater プラットフォームが latest.json から
      # 欠落していたら、ここで明示的に fail させて notify-on-failure を発火させる。
      # 有効なプラットフォーム（例: macOS）の latest.json は前段で既に公開済みなので、
      # それらの自動更新は止めずに、壊れている方（例: Windows）だけを可視化できる。
      # これにより「latest.json は更新されたのに一部 OS の自動更新が静かに壊れている」
      # 状態（v0.16.7 の Windows）を二度と見逃さない。
      - name: Verify all updater platforms are present
        run: |
          set -euo pipefail
          if [ -n "${MISSING_PLATFORMS:-}" ]; then
            echo "::error::Updater bundle missing for:${MISSING_PLATFORMS}. latest.json was published WITHOUT these platforms, so their auto-update is broken. Check that the 'Upload updater bundles to release' step uploaded the -setup.nsis.zip / .app.tar.gz for each target."
            exit 1
          fi
          echo "All expected updater platforms are present in latest.json."

  # build / generate-updater-json のいずれかが失敗したら Issue を起票して可視化する。
  # 目的: ビルド失敗が「静かに」起き、数日後に「アプリが更新されない」で初めて気づく
  # 事故を防ぐ（v0.16.4 / v0.16.5 の macOS 公証 403 で実害。latest.json が 0.16.3 に固定された）。
  # if: failure() なので、いずれかの ancestor ジョブが失敗したときだけ走る
  # （generate-updater-json が skipped でも build 失敗を拾える）。
  notify-on-failure:
    needs: [resolve-release, build, generate-updater-json]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update issue on release build failure
        uses: actions/github-script@v7
        with:
          script: |
            const tag =
              '${{ needs.resolve-release.outputs.tag }}' ||
              context.payload.release?.tag_name ||
              '${{ inputs.release_tag }}' ||
              'unknown';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const title = `🚨 Release build failed for ${tag}`;
            const body = [
              `**Tauri Desktop Build が失敗しました（tag: \`${tag}\`）。**`,
              '',
              `- 失敗したワークフロー実行: ${runUrl}`,
              '',
              '## なぜ重要か',
              'macOS ビルドが失敗すると `Graphium_aarch64.app.tar.gz` がリリースに上がらず、',
              '`generate-updater-json` が skipped になって `latest.json` が再生成されません。',
              'その結果 GitHub Pages の `latest.json` が古いバージョンに固定され、',
              'デスクトップアプリに更新が出なくなります（= 静かな失敗）。',
              '',
              '## 確認すること',
              '1. 上記実行ログの「Build Tauri app」ステップのエラーを確認',
              '2. macOS の公証 403 (`A required agreement is missing or has expired`) なら、',
              '   https://developer.apple.com/account で改定された規約に同意してから再実行',
              `3. 復旧後: \`gh workflow run "Tauri Desktop Build" -f release_tag=${tag}\` で再ビルド`,
              '',
              '_この Issue は tauri-build.yml の notify-on-failure ジョブが自動起票しました。_',
            ].join('\n');

            const { owner, repo } = context.repo;
            // 同じ tag の未クローズ Issue があれば重複起票せずコメントを足す
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'release-failure', per_page: 100,
            });
            const dup = existing.data.find((i) => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: dup.number,
                body: `再びビルドが失敗しました: ${runUrl}`,
              });
              core.notice(`Commented on existing issue #${dup.number}`);
              return;
            }
            // label が無ければ作成（失敗しても無視）
            await github.rest.issues.createLabel({
              owner, repo, name: 'release-failure', color: 'b60205',
              description: 'Release/desktop build pipeline failure',
            }).catch(() => {});
            const created = await github.rest.issues.create({
              owner, repo, title, body, labels: ['release-failure'],
            });
            core.notice(`Opened issue #${created.data.number}`);
