name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Dependency boundaries
        run: pnpm run lint:deps

      - name: Run tests
        run: pnpm test -- --run

      # マニュアルが実態からズレていないか（バッジのバージョン実在・ロードマップの
      # 遅れ・日英の食い違い・リンク/アンカー/図の実在）。リリース履歴は CHANGELOG を
      # ビルド時に取り込むので対象外。
      - name: Manual drift check
        run: pnpm manual:check

      # 日本語 Web フォントは .gitignore 済みで、pnpm build の先頭（scripts/fetch-fonts.mjs）が
      # fonts.gstatic.com から 490 チャンク約 8MB を毎回取りに行く。CDN の 429 や一時的な
      # 名前解決失敗で「変更と無関係に」この Build check が赤くなるのを避けるためキャッシュする。
      # キーは fetch-fonts.mjs のハッシュ = 要求するファミリ / ウェイトを変えれば必ず取り直す。
      # restore-keys は張らない: 古い世代が復元されると fetch-fonts が「取得済み」と判断して
      # 意図と違うフォントのままビルドが通ってしまうため（キー不一致なら取り直させる）。
      # 取得失敗そのものは fatal のまま。フォント欠けの dist を作らせない。
      - name: Cache Japanese webfonts
        uses: actions/cache@v4
        with:
          path: public/fonts/jp
          key: jp-fonts-${{ runner.os }}-${{ hashFiles('scripts/fetch-fonts.mjs') }}

      - name: Build check
        run: pnpm build

  # 保存経路の E2E スモーク（e2e/save-smoke.mjs）。
  # 実サーバー + vite + Chromium で「作成 → 保存 → SidePeek 開閉 → リロード →
  # 内容一致」を検証する（PR #454 / #502 / #514 級のデータ破壊の再発防止）。
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Save-path E2E smoke
        run: pnpm test:e2e
